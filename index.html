<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="피아노, 우쿨렐레, 기타 코드를 한 화면에서 비교해 보는 모바일 우선 웹앱">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>코드 비교 · 피아노 · 우쿨렐레 · 기타</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div class="header-title-group">
          <img class="usagi-only usagi-header-avatar" src="./assets/usagi-face.png" alt="" aria-hidden="true">
          <h1 class="app-title">코드 비교</h1>
          <span class="app-subtitle">피아노 · 우쿨렐레 · 기타</span>
        </div>
        <div class="header-actions">
          <button
            id="btn-theme"
            class="launcher-btn"
            type="button"
            aria-label="테마 선택"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            <span id="theme-btn-icon" aria-hidden="true">🎨</span>
            <img id="theme-btn-usagi" class="theme-btn-usagi" src="./assets/usagi-face.png" alt="" hidden aria-hidden="true">
            <span class="launcher-label">테마</span>
          </button>
          <button
            id="btn-app-launcher"
            class="launcher-btn"
            type="button"
            aria-label="내 다른 앱 바로가기"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            <span aria-hidden="true">⊞</span>
            <span class="launcher-label">내 앱</span>
          </button>
        </div>
      </div>
      <div class="search-wrap">
        <label class="sr-only" for="chord-search">코드 검색</label>
        <input
          id="chord-search"
          class="search-input"
          type="search"
          inputmode="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="코드 검색 (예: Cm7, F#dim, G7)"
        >
        <div id="search-results" class="search-results" hidden role="listbox" aria-label="검색 결과"></div>
      </div>
    </header>

    <main class="app-main">
      <!-- 코드 탐색 탭 -->
      <section id="view-chords" class="tab-view active" aria-label="코드 찾기">
        <div class="usagi-only usagi-banner" aria-hidden="true">
          <img class="usagi-banner-img" src="./assets/usagi-cheer.png" alt="">
          <span class="usagi-banner-text">우사기와 함께 신나는 코드 연습! ♪</span>
          <img class="usagi-banner-img" src="./assets/usagi-dance.png" alt="">
        </div>

        <section class="panel" aria-labelledby="root-heading">
          <h2 id="root-heading" class="section-label">루트 음 선택</h2>
          <div id="root-grid" class="root-grid" role="group" aria-label="12음 루트 선택"></div>
        </section>

        <section class="panel" aria-labelledby="type-heading">
          <h2 id="type-heading" class="section-label">코드 종류</h2>
          <div id="type-list" class="type-list" role="group" aria-label="코드 종류 선택"></div>
        </section>

        <section id="chord-detail" class="detail-card" aria-live="polite">
          <div class="detail-header">
            <div class="detail-title-group">
              <div class="detail-symbol-row">
                <h2 id="detail-symbol" class="detail-symbol">C</h2>
                <span id="detail-name" class="detail-name">C 메이저</span>
              </div>
              <div id="detail-notes" class="note-pills" aria-label="구성음"></div>
            </div>
            <div class="detail-actions">
              <button id="btn-play" class="icon-btn play-btn" type="button" aria-label="코드 소리 듣기" title="소리 듣기">
                <span aria-hidden="true">▶</span>
                <span class="btn-label">듣기</span>
              </button>
              <button id="btn-favorite" class="icon-btn fav-btn" type="button" aria-label="즐겨찾기 추가" aria-pressed="false" title="즐겨찾기">
                <span id="fav-icon" aria-hidden="true">☆</span>
              </button>
            </div>
          </div>

          <div class="instrument-tabs" role="tablist" aria-label="악기 보기 선택">
            <button class="inst-tab active" type="button" role="tab" aria-selected="true" data-inst="all">전체 보기</button>
            <button class="inst-tab" type="button" role="tab" aria-selected="false" data-inst="piano">피아노</button>
            <button class="inst-tab" type="button" role="tab" aria-selected="false" data-inst="ukulele">우쿨렐레</button>
            <button class="inst-tab" type="button" role="tab" aria-selected="false" data-inst="guitar">기타</button>
          </div>

          <div id="diagrams-container" class="diagrams-container"></div>
        </section>
      </section>

      <!-- 즐겨찾기 탭 -->
      <section id="view-favorites" class="tab-view" hidden aria-label="즐겨찾기">
        <div class="panel">
          <div class="fav-header-row">
            <h2 class="section-label">저장한 코드</h2>
            <span id="fav-total-label" class="fav-total-label">0개</span>
          </div>
          <div id="favorites-list" class="favorites-list"></div>
        </div>
      </section>

      <!-- 내 곡 탭 -->
      <section id="view-songs" class="tab-view" hidden aria-label="내 곡"></section>
    </main>

    <!-- 코드 미리보기 하단 시트 -->
    <div id="chord-sheet-backdrop" class="sheet-backdrop" hidden>
      <div class="bottom-sheet" role="dialog" aria-modal="true" aria-label="코드 운지 상세">
        <div id="chord-sheet-content"></div>
      </div>
    </div>

    <!-- 테마 선택 하단 시트 -->
    <div id="theme-sheet-backdrop" class="sheet-backdrop" hidden>
      <div class="bottom-sheet" role="dialog" aria-modal="true" aria-label="테마 선택">
        <div class="sheet-header">
          <div>
            <h2 class="edit-title">테마 선택</h2>
            <span class="diagram-sub">원하는 분위기를 골라보세요</span>
          </div>
          <button id="theme-close-btn" class="icon-btn" type="button" aria-label="닫기">✕</button>
        </div>
        <div id="theme-options" class="app-links-list">
          <button class="theme-card" type="button" data-theme-choice="default">
            <span class="theme-swatch swatch-default" aria-hidden="true"></span>
            <span class="app-link-info">
              <strong class="app-link-title">기본 (블루)</strong>
              <span class="app-link-sub">시스템 라이트/다크 모드 자동 적용</span>
            </span>
            <span class="theme-check" aria-hidden="true">✓</span>
          </button>
          <button class="theme-card" type="button" data-theme-choice="acoustic">
            <span class="theme-swatch swatch-acoustic" aria-hidden="true"></span>
            <span class="app-link-info">
              <strong class="app-link-title">어쿠스틱 우드 🎸</strong>
              <span class="app-link-sub">따뜻한 통기타 나무·크림 톤</span>
            </span>
            <span class="theme-check" aria-hidden="true">✓</span>
          </button>
          <button class="theme-card" type="button" data-theme-choice="usagi">
            <img class="theme-swatch theme-swatch-img" src="./assets/usagi-face.png" alt="" aria-hidden="true">
            <span class="app-link-info">
              <strong class="app-link-title">우사기 (먼작귀)</strong>
              <span class="app-link-sub">우사기 일러스트 &amp; 버터 옐로우</span>
            </span>
            <span class="theme-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 내 앱 바로가기 하단 시트 -->
    <div id="app-launcher-backdrop" class="sheet-backdrop" hidden>
      <div class="bottom-sheet" role="dialog" aria-modal="true" aria-label="내 다른 앱 바로가기">
        <div class="sheet-header">
          <div>
            <h2 class="edit-title">내 다른 앱</h2>
            <span class="diagram-sub">LazyCamper 웹앱 바로가기</span>
          </div>
          <button id="launcher-close-btn" class="icon-btn" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="app-links-list">
          <a class="app-link-card" href="https://lazycamper.github.io/my-car-manager/" target="_blank" rel="noopener noreferrer">
            <span class="app-link-icon" aria-hidden="true">🚗</span>
            <span class="app-link-info">
              <strong class="app-link-title">내 차 관리</strong>
              <span class="app-link-sub">my-car-manager</span>
            </span>
            <span class="app-link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="app-link-card" href="https://lazycamper.github.io/my-whisky-collection/" target="_blank" rel="noopener noreferrer">
            <span class="app-link-icon" aria-hidden="true">🥃</span>
            <span class="app-link-info">
              <strong class="app-link-title">위스키 컬렉션</strong>
              <span class="app-link-sub">my-whisky-collection</span>
            </span>
            <span class="app-link-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="nav-btn active" type="button" data-tab="chords" aria-current="page">
        <span class="nav-icon" aria-hidden="true">♪</span>
        <span class="nav-text">코드</span>
      </button>
      <button class="nav-btn" type="button" data-tab="favorites">
        <span class="nav-icon" aria-hidden="true">★</span>
        <span class="nav-text">즐겨찾기 <span id="nav-fav-badge" class="nav-badge" hidden>0</span></span>
      </button>
      <button class="nav-btn" type="button" data-tab="songs">
        <span class="nav-icon" aria-hidden="true">♫</span>
        <span class="nav-text">내 곡</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
